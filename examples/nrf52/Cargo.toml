[package]
name = "trouble-nrf52-examples"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["defmt", "time-driver-rtc1", "gpiote", "unstable-pac", "rt"] }
embassy-futures = "0.1.1"
embassy-sync = { version = "0.8", features = ["defmt"] }

futures = { version = "0.3", default-features = false, features = ["async-await"]}
nrf-sdc = { version = "0.4", default-features = false, features = ["defmt", "peripheral", "central"] }
nrf-mpsl = { version = "0.3", default-features = false, features = ["defmt", "critical-section-impl"] }
bt-hci = { version = "0.10", default-features = false, features = ["defmt"] }
trouble-host = { path = "../../host", features = ["derive", "scan", "gatt"] }
trouble-example-apps = { version = "0.1.0", path = "../apps", features = ["defmt"] }

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"
static_cell = "2"

[profile.release]
debug = 2

[patch.crates-io]
#embassy-executor = {path = "../../../embassy/embassy-executor"}
#embassy-time-queue-utils = {path = "../../../embassy/embassy-time-queue-utils"}
#embassy-sync = {path = "../../../embassy/embassy-sync"}
#embassy-futures = {path = "../../../embassy/embassy-futures"}
#embassy-time = {path = "../../../embassy/embassy-time"}
#embassy-time-driver = {path = "../../../embassy/embassy-time-driver"}
#embassy-embedded-hal = {path = "../../../embassy/embassy-embedded-hal"}
#embassy-hal-internal = {path = "../../../embassy/embassy-hal-internal"}
# embassy-executor = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
# embassy-nrf = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
# embassy-sync = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
# embassy-futures = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
# embassy-time = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
# embassy-time-driver = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
# embassy-embedded-hal = {git = "https://github.com/embassy-rs/embassy.git", rev="3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a"}
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "1a6e661155cdd1d6a86f3ae7b7fb117343781533"}
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "1a6e661155cdd1d6a86f3ae7b7fb117343781533"}

[features]
# The nRF52810 only has 24K of RAM, so the default packet pool and L2CAP queues
# have to be scaled down to leave room for the SoftDevice Controller.
nrf52810 = [
    "embassy-nrf/nrf52810",
    "nrf-sdc/nrf52810",
    "trouble-host/l2cap-rx-queue-size-4",
    "trouble-host/l2cap-tx-queue-size-4",
    "trouble-host/default-packet-pool-mtu-128",
    "trouble-host/default-packet-pool-size-8",
]
nrf52832 = [
    "embassy-nrf/nrf52832",
    "nrf-sdc/nrf52832",
]
nrf52833 = [
    "embassy-nrf/nrf52833",
    "nrf-sdc/nrf52833",
]
nrf52840 = [
    "embassy-nrf/nrf52840",
    "nrf-sdc/nrf52840",
]
security = [
    "trouble-example-apps/security",
]

[[bin]]
name = "ble_bas_central_sec"
required-features = ["security"]

[[bin]]
name = "ble_bas_peripheral_sec"
required-features = ["security"]

[[bin]]
name = "ble_bas_peripheral_auth"
required-features = ["security"]

[[bin]]
name = "ble_bas_central_auth"
required-features = ["security"]

[[bin]]
name = "ble_bas_peripheral_pass_key"
required-features = ["security"]

[[bin]]
name = "ble_bas_central_pass_key"
required-features = ["security"]

[[bin]]
name = "ble_bas_central_bonding"
required-features = ["security", "nrf52840"]

[[bin]]
name = "ble_bas_peripheral_bonding"
required-features = ["security", "nrf52840"]
